<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f766e">
<title>가온자리한의원</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", Dotum, sans-serif;
    background: radial-gradient(120% 90% at 50% 0%, #eef7f5 0%, #f6f8fa 45%, #eef1f4 100%);
    color: #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px 18px calc(24px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  .lock-wrap {
    width: 100%;
    max-width: 352px;
    opacity: 0;
    visibility: hidden;
    transition: opacity .28s ease;
  }
  .lock-wrap.ready { opacity: 1; visibility: visible; }
  .card {
    background: #ffffff;
    border: 1px solid #e2e8ee;
    border-radius: 18px;
    padding: 32px 26px 24px;
    box-shadow: 0 10px 30px rgba(15, 66, 60, 0.07), 0 1px 2px rgba(15, 66, 60, 0.04);
    text-align: center;
  }
  .mark {
    width: 46px;
    height: 46px;
    margin: 0 auto 16px;
    border-radius: 14px;
    background: linear-gradient(140deg, #134e4a, #0f766e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    line-height: 1;
    box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25);
  }
  h1 {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: #134e4a;
  }
  .sub {
    font-size: 12px;
    color: #7c8b99;
    margin-top: 6px;
    margin-bottom: 24px;
    letter-spacing: -0.1px;
  }
  .field { position: relative; text-align: left; }
  label.for-input {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: #8a97a4;
    letter-spacing: 0.2px;
    margin-bottom: 6px;
  }
  input[type="password"] {
    width: 100%;
    padding: 13px 44px 13px 14px;
    border: 1.5px solid #dfe5eb;
    border-radius: 10px;
    font-size: 16px;
    color: #1e293b;
    background: #fbfcfd;
    outline: none;
    transition: border-color .15s, background .15s, box-shadow .15s;
    -webkit-appearance: none;
  }
  input[type="password"]:focus {
    border-color: #0f766e;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
  }
  input[type="password"]::placeholder { color: #b6c0ca; letter-spacing: 1px; }
  .btn-open {
    width: 100%;
    margin-top: 12px;
    padding: 13px 16px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(140deg, #134e4a, #0f766e);
    color: #ffffff;
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: opacity .15s, transform .06s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-open:hover { opacity: .93; }
  .btn-open:active { transform: translateY(1px); }
  .btn-open[disabled] { opacity: .55; cursor: default; transform: none; }
  .remember {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 14px;
    font-size: 12.5px;
    color: #64748b;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .remember input { width: 15px; height: 15px; accent-color: #0f766e; cursor: pointer; flex-shrink: 0; }
  .msg {
    min-height: 17px;
    margin-top: 12px;
    font-size: 12.5px;
    line-height: 1.45;
    color: #b91c1c;
    letter-spacing: -0.1px;
  }
  .msg.ok { color: #0f766e; }
  .shake { animation: shake .32s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    45% { transform: translateX(5px); }
    70% { transform: translateX(-3px); }
    90% { transform: translateX(2px); }
  }
  .foot {
    margin-top: 18px;
    font-size: 10.5px;
    color: #a3adb8;
    letter-spacing: 0.2px;
  }
</style>
</head>
<body>

<div class="lock-wrap" id="lock-wrap">
  <div class="card" id="lock-card">
    <div class="mark" aria-hidden="true">🌿</div>
    <h1>가온자리한의원</h1>
    <div class="sub">표준 합방기 · 관계자 전용</div>

    <form id="lock-form" autocomplete="off" novalidate>
      <div class="field">
        <label class="for-input" for="pw">비밀번호</label>
        <input type="password" id="pw" name="pw" placeholder="••••••••" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" inputmode="text">
      </div>
      <button type="submit" class="btn-open" id="btn-open">열기</button>
      <label class="remember" for="remember">
        <input type="checkbox" id="remember" checked>
        <span>이 기기에서 기억하기</span>
      </label>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>

    <div class="foot">가온자리한의원 · 잠금 문서</div>
  </div>
</div>

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function bytesToB64(bytes) {
    var bin = "";
    var chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(bin);
  }
  function enc(str) { return new TextEncoder().encode(str); }

  function subtleAvailable() {
    return !!(window.crypto && window.crypto.subtle && window.crypto.subtle.decrypt);
  }

  async function decryptWithKey(key) {
    var ctor = window.crypto.subtle;
    var plain = await ctor.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(CFG.iv), additionalData: enc(CFG.aad), tagLength: 128 },
      key,
      b64ToBytes(CFG.ct)
    );
    return new TextDecoder("utf-8").decode(plain);
  }

  async function deriveKey(password) {
    var ctor = window.crypto.subtle;
    var base = await ctor.importKey("raw", enc(password), "PBKDF2", false, ["deriveKey"]);
    return await ctor.deriveKey(
      { name: "PBKDF2", salt: b64ToBytes(CFG.salt), iterations: CFG.iter, hash: "SHA-256" },
      base,
      { name: "AES-GCM", length: 256 },
      true,
      ["decrypt"]
    );
  }

  function loadStoredKey() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (!obj || obj.v !== CFG.v || !obj.k) return null;
      return b64ToBytes(obj.k);
    } catch (e) { return null; }
  }
  function storeKey(rawBytes) {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({ v: CFG.v, k: bytesToB64(rawBytes), t: Date.now() }));
    } catch (e) {}
  }
  function clearStoredKey() {
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
  }

      '</style>' +
      '<button type="button" id="pk-lock-btn" class="no-print" title="잠그기 (다음 접속 시 비밀번호 필요)" ' +
      'onclick="if(window.__pkLock){window.__pkLock();}">🔒 잠금</button>' +
      '<script>window.__pkLock=function(){try{localStorage.removeItem("' + LS_KEY + '");}catch(e){}' +
      'window.location.reload();};<\/script>';

    var idx = html.lastIndexOf("</body>");
    if (idx === -1) { html += extra; }
    else { html = html.slice(0, idx) + extra + html.slice(idx); }

    document.open();
    document.write(html);
    document.close();

    /* document.write 로 새로 파싱된 문서에서 초기화 이벤트가 누락되면 한 번만 보정한다. */
    setTimeout(function () {
      try {
        var d = document.getElementById("current-date");
        if (d && !d.innerText) {
          window.dispatchEvent(new Event("DOMContentLoaded"));
        }
      } catch (e) {}
    }, 80);
  }

  function showLock() {
    lockWrap.classList.add("ready");
    try { pwInput.focus({ preventScroll: true }); } catch (e) { pwInput.focus(); }
  }

  function fail(text) {
    msg.textContent = text;
    msg.classList.remove("ok");
    lockCard.classList.remove("shake");
    void lockCard.offsetWidth;
    lockCard.classList.add("shake");
    pwInput.select();
  }

  async function tryAutoUnlock() {
    var raw = loadStoredKey();
    if (!raw) return false;
    try {
      var key = await window.crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
      var html = await decryptWithKey(key);
      mount(html);
      return true;
    } catch (e) {
      clearStoredKey();
      return false;
    }
  }

  form.addEventListener("submit", async function (ev) {
    ev.preventDefault();
    if (btnOpen.disabled) return;
    var pw = pwInput.value;
    if (!pw) { fail("비밀번호를 입력해 주세요."); return; }

    btnOpen.disabled = true;
    btnOpen.textContent = "확인 중…";
    msg.textContent = "";
    msg.classList.remove("ok");

    try {
      var key = await deriveKey(pw);
      var html = await decryptWithKey(key);
      if (rememberBox.checked) {
        try {
          var exported = await window.crypto.subtle.exportKey("raw", key);
          storeKey(new Uint8Array(exported));
        } catch (e) {}
      } else {
        clearStoredKey();
      }
      mount(html);
    } catch (e) {
      if (e && (e.name === "OperationError" || e.name === "DataError")) {
        fail("비밀번호가 맞지 않습니다. 다시 확인해 주세요.");
      } else {
        fail("열지 못했습니다. 잠시 후 다시 시도해 주세요.");
      }
      btnOpen.disabled = false;
      btnOpen.textContent = "열기";
    }
  });

  (async function boot() {
    if (!subtleAvailable()) {
      lockWrap.classList.add("ready");
      btnOpen.disabled = true;
      msg.textContent = "보안 연결(HTTPS)에서만 열 수 있습니다.";
      return;
    }
    var opened = false;
    try { opened = await tryAutoUnlock(); } catch (e) { opened = false; }
    if (!opened) showLock();
  })();
})();
</script>
</body>
</html>
